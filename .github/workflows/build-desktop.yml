name: Build desktop installers

# Installers are built on demand only: Actions → Build desktop installers → Run
# workflow (tick the platforms you want and pick a ref), or by pushing a v* tag
# by hand. Merges never build automatically — they only bump the version (see
# version-on-merge.yml), so any build can be pointed at the tag you want.
#
# Each platform is an independent checkbox, so a run costs one runner per ticked
# box. Separate runs accumulate on the same release: publishing uploads with
# --clobber, so building macOS today and Windows tomorrow leaves both attached.
#
# Publishing never needs a tag to exist up front. When the ref is not a v* tag
# the `prepare` job derives one from the version committed at that ref
# (frontend/package.json, kept current by version-on-merge.yml) and walks the
# patch level up until it finds a tag nobody has used yet. The release step
# creates that tag at the built commit, and the build itself is stamped with the
# matching version so the installer filename and the tag never disagree.
on:
  workflow_dispatch:
    inputs:
      windows_x64:
        description: Windows x64 installer (.exe)
        type: boolean
        required: false
        default: true
      macos_arm64:
        description: macOS Apple Silicon installer (.dmg)
        type: boolean
        required: false
        default: true
      macos_x64:
        description: macOS Intel installer (.dmg)
        type: boolean
        required: false
        default: true
      ref:
        description: "Git ref to build — tag, branch or SHA (empty = branch this run was started from)"
        type: string
        required: false
      publish:
        description: Attach the installers to the GitHub release for the built tag
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  prepare:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      ref: ${{ steps.select.outputs.ref }}
      tag: ${{ steps.select.outputs.tag }}
      version: ${{ steps.select.outputs.version }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full history and tags: the tag is derived from the version committed
          # at this ref and has to be compared against the tags already pushed.
          fetch-depth: 0

      - name: Resolve targets, ref and tag
        id: select
        env:
          WINDOWS_X64: ${{ inputs.windows_x64 }}
          MACOS_ARM64: ${{ inputs.macos_arm64 }}
          MACOS_X64: ${{ inputs.macos_x64 }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          all='[
            {"id":"windows-x64","name":"Windows x64","os":"windows-2022","target":"win","format":"nsis","arch":"x64","artifact":"questions-to-insights-windows-x64","installer":"frontend/release/*.exe"},
            {"id":"macos-arm64","name":"macOS Apple Silicon","os":"macos-latest","target":"mac","format":"dmg","arch":"arm64","artifact":"questions-to-insights-macos-arm64","installer":"frontend/release/*.dmg"},
            {"id":"macos-x64","name":"macOS Intel","os":"macos-15-intel","target":"mac","format":"dmg","arch":"x64","artifact":"questions-to-insights-macos-x64","installer":"frontend/release/*.dmg"}
          ]'

          # A tag push carries no inputs at all, which means "build everything".
          if [ -z "${WINDOWS_X64}${MACOS_ARM64}${MACOS_X64}" ]; then
            wanted='["windows-x64","macos-arm64","macos-x64"]'
          else
            wanted='[]'
            if [ "$WINDOWS_X64" = "true" ]; then
              wanted=$(jq -c '. + ["windows-x64"]' <<<"$wanted")
            fi
            if [ "$MACOS_ARM64" = "true" ]; then
              wanted=$(jq -c '. + ["macos-arm64"]' <<<"$wanted")
            fi
            if [ "$MACOS_X64" = "true" ]; then
              wanted=$(jq -c '. + ["macos-x64"]' <<<"$wanted")
            fi
          fi

          selected=$(jq -c --argjson want "$wanted" \
            '[.[] | select(.id as $id | $want | index($id))]' <<<"$all")

          if [ "$(jq 'length' <<<"$selected")" -eq 0 ]; then
            echo "No installer selected — tick at least one platform." >&2
            exit 1
          fi

          ref=${INPUT_REF:-$GITHUB_REF}
          sha=$(git rev-parse HEAD)

          # A v* ref publishes to exactly that tag. Anything else — a branch, a
          # SHA, or an empty ref — derives the tag from the version this commit
          # carries in frontend/package.json. If that tag already belongs to a
          # different commit the patch level walks up until a free name is
          # found, so repeated builds off a branch each get their own tag
          # instead of clobbering a shipped release.
          case "$ref" in
            refs/tags/v*) tag=${ref#refs/tags/} ;;
            v[0-9]*)      tag=$ref ;;
            *)
              version=$(jq -r .version frontend/package.json)
              base=${version%%-*}
              IFS=. read -r major minor patch <<<"$base"
              major=${major:-0}
              minor=${minor:-0}
              patch=${patch:-0}
              tag="v$major.$minor.$patch"
              while true; do
                taken=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
                if [ -z "$taken" ] || [ "$taken" = "$sha" ]; then
                  break
                fi
                echo "$tag is taken by $taken — trying the next patch level"
                patch=$((patch + 1))
                tag="v$major.$minor.$patch"
              done
              ;;
          esac

          echo "Building $(jq -r '[.[].id] | join(", ")' <<<"$selected") from $ref ($sha) as $tag"
          echo "matrix={\"include\":$selected}" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    env:
      # Produce unsigned artifacts unless signing credentials are added later.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Installers are stored as Actions artifacts; the publish job handles releases.
      GH_TOKEN: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Only matters when prepare had to walk the patch level up: without this
      # the installer filename would keep the committed version while the
      # release carries the next tag.
      - name: Stamp the resolved version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          npm --prefix frontend version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          npm --prefix backend  version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          echo "Building version $VERSION"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build installer
        working-directory: frontend
        run: npm run electron:dist -- --${{ matrix.target }} ${{ matrix.format }} --${{ matrix.arch }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: [prepare, build]
    if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          path: installers
          merge-multiple: true

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ needs.prepare.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -R installers

          # Create the release empty first. Handing the assets to `gh release
          # create` means a single failed upload deletes the release it just
          # made, so nothing survives a flaky transfer. --target creates the tag
          # at the built commit when it does not exist yet, which is what makes
          # publishing from a branch work without a hand-pushed tag.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target "$TARGET" \
              --title "$TAG" --generate-notes
          fi

          # Installers run to a few hundred MB and uploads.github.com rejects
          # them intermittently (seen: HTTP 400, HTTP 500) with no useful
          # detail. Upload one at a time and retry, so a stalled transfer costs
          # one file instead of the whole publish. --clobber lets a retry
          # replace a partial asset rather than collide with it.
          failed=0
          for asset in installers/*; do
            name=$(basename "$asset")
            for attempt in 1 2 3; do
              echo "Uploading $name (attempt $attempt)"
              if gh release upload "$TAG" --repo "$REPO" --clobber "$asset"; then
                echo "Uploaded $name"
                continue 2
              fi
              sleep $((attempt * 20))
            done
            echo "::error::Failed to upload $name after 3 attempts"
            failed=1
          done
          exit $failed

      - name: Summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### Published $TAG"
            echo
            echo "<https://github.com/$REPO/releases/tag/$TAG>"
          } >> "$GITHUB_STEP_SUMMARY"
