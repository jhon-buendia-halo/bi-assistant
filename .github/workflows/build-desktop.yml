name: Build desktop installers

# Installers are built on demand only: Actions → Build desktop installers → Run
# workflow (pick which platforms and which ref), or by pushing a v* tag by hand.
# Merges never build automatically — they only bump the version (see
# version-on-merge.yml), so any build can be pointed at the tag you want.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Which installers to build
        type: choice
        required: true
        default: all
        options:
          - all
          - macos-all
          - macos-arm64
          - macos-x64
          - windows-x64
      ref:
        description: "Git ref to build — tag, branch or SHA (empty = branch this run was started from)"
        type: string
        required: false
      publish:
        description: Attach the installers to the GitHub release for the built tag
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  prepare:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      ref: ${{ steps.select.outputs.ref }}
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - name: Resolve targets and ref
        id: select
        env:
          TARGETS: ${{ inputs.targets || 'all' }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          all='[
            {"id":"windows-x64","name":"Windows x64","os":"windows-2022","target":"win","format":"nsis","arch":"x64","artifact":"questions-to-insights-windows-x64","installer":"frontend/release/*.exe"},
            {"id":"macos-arm64","name":"macOS Apple Silicon","os":"macos-latest","target":"mac","format":"dmg","arch":"arm64","artifact":"questions-to-insights-macos-arm64","installer":"frontend/release/*.dmg"},
            {"id":"macos-x64","name":"macOS Intel","os":"macos-15-intel","target":"mac","format":"dmg","arch":"x64","artifact":"questions-to-insights-macos-x64","installer":"frontend/release/*.dmg"}
          ]'

          case "$TARGETS" in
            all)        selected=$(jq -c '.' <<<"$all") ;;
            macos-all)  selected=$(jq -c '[.[] | select(.target == "mac")]' <<<"$all") ;;
            *)          selected=$(jq -c --arg id "$TARGETS" '[.[] | select(.id == $id)]' <<<"$all") ;;
          esac

          if [ "$(jq 'length' <<<"$selected")" -eq 0 ]; then
            echo "No build target matches '$TARGETS'" >&2
            exit 1
          fi

          ref=${INPUT_REF:-$GITHUB_REF}
          case "$ref" in
            refs/tags/*) tag=${ref#refs/tags/} ;;
            v*)          tag=$ref ;;
            *)           tag="" ;;
          esac

          echo "Building $(jq -r '[.[].id] | join(", ")' <<<"$selected") from $ref"
          echo "matrix={\"include\":$selected}" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    env:
      # Produce unsigned artifacts unless signing credentials are added later.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Installers are stored as Actions artifacts; the publish job handles releases.
      GH_TOKEN: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build installer
        working-directory: frontend
        run: npm run electron:dist -- --${{ matrix.target }} ${{ matrix.format }} --${{ matrix.arch }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: [prepare, build]
    if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a tag
        if: needs.prepare.outputs.tag == ''
        run: |
          echo "Publishing needs a tag: build a v* tag (or pass one as 'ref')." >&2
          exit 1

      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          path: installers
          merge-multiple: true

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -R installers
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber installers/*
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes installers/*
          fi
