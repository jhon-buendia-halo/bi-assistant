<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>CU4 · New conversation: name, pick datasets, Create</title>
  <meta name="wf-status" content="as-built">
  <meta name="wf-version" content="v0.29.0">
  <meta name="wf-role" content="user">
  <meta name="wf-spec" content="specs/system/ui.md#47-new-session-composer">
  <link rel="stylesheet" href="../../_kit/hub.css">
  <script src="../../_kit/icons.js"></script>
  <script src="../../_kit/shell.js" defer></script>
  <style>
    /* Page-local: the drawer's New conversation "+" is surface-selected while the composer is open (ui.md 1.3). */
    .wf-sessions-head > span:last-child { background: var(--qti-surface-selected); border-radius: 8px; padding: 4px; margin: -4px; }
    /* Kit gap: in the Sessions area the Expand right panel button sits in the page header, not floating on the page card. */
    .wf-page > span[title="Expand right panel"] { display: none !important; }
  </style>
</head>
<!--
  Workflow step: Start chat on the Official agent (CU3), "Start New Conversation" in the page header,
  or "+" (New conversation) in the drawer opens this composer. Data: GET /datasets, GET /llm/settings.
  Create = POST /sessions { name, datasets } -> toast with the server message, the drawer list reloads
  (GET /sessions) and the new session opens (CU5 / CU6).
  A User has no manage-llm, so the Reasoning effort dropdown is hidden (ui.md 1.6).
  Create stays disabled until a name is typed and at least one dataset is selected.
-->
<body data-area="Sessions" data-role="user" data-mode="org" data-initials="JB"
      data-sessions='[["Cup historian","Cup historian · World Cup Core"],["World Cup analysis","World Cup Core"]]'>
  <main class="flush">
    <header class="wf-page-header" style="align-items:center">
      <img src="../../../../frontend/public/brand/agentic-hub/page-header-icon.svg" width="36" height="36" alt="">
      <h2 class="h2 grow">New conversation</h2>
      <span class="btn btn-secondary"><i data-lucide="square-pen" data-size="20"></i><span>Start New Conversation</span></span>
      <span class="btn-icon" title="Expand right panel"><i data-lucide="panel-right" data-size="16"></i></span>
    </header>

    <div class="col" style="align-items:center;padding:40px 24px 32px;gap:0">
      <div class="card" style="width:100%;max-width:920px;padding:16px">
        <label class="col" style="gap:6px">
          <span class="field-label">Session name</span>
          <span class="field" style="font-size:14px;color:var(--qti-placeholder)">My new session</span>
        </label>
        <div class="row between" style="margin-top:16px">
          <div class="row g12">
            <span class="row g6" style="padding:4px 6px;border-radius:6px;color:var(--qti-fg)"><i data-lucide="sparkle" data-size="13"></i><span>gpt-5</span></span>
            <!-- Reasoning effort dropdown: hidden for a User (needs manage-llm) -->
          </div>
          <span class="btn btn-primary" style="opacity:0.55" title="Name the session and select at least one dataset"><span>Create</span><i data-lucide="corner-down-left" data-size="14"></i></span>
        </div>
      </div>

      <div style="width:100%;max-width:920px;margin-top:32px">
        <p class="field-label" style="margin:0">Select at least one dataset for this session</p>
        <div class="col" style="margin-top:8px">
          <div class="list-row list-row-selected row g12" style="padding:10px 12px">
            <span style="width:36px;height:36px;border-radius:8px;background:var(--qti-surface-muted);color:var(--qti-accent);display:grid;place-items:center;flex:none"><i data-lucide="workflow" data-size="15"></i></span>
            <span style="font-size:13px;font-weight:500">World Cup Core</span>
            <span class="small muted">12 entities</span>
            <span class="grow"></span>
            <span style="color:var(--qti-primary);display:flex"><i data-lucide="circle-check" data-size="16"></i></span>
          </div>
          <div class="list-row row g12" style="padding:10px 12px">
            <span style="width:36px;height:36px;border-radius:8px;background:var(--qti-surface-muted);color:var(--qti-accent);display:grid;place-items:center;flex:none"><i data-lucide="workflow" data-size="15"></i></span>
            <span style="font-size:13px;font-weight:500">Claims</span>
            <span class="small muted">8 entities</span>
          </div>
          <div class="list-row row g12" style="padding:10px 12px">
            <span style="width:36px;height:36px;border-radius:8px;background:var(--qti-surface-muted);color:var(--qti-accent);display:grid;place-items:center;flex:none"><i data-lucide="workflow" data-size="15"></i></span>
            <span style="font-size:13px;font-weight:500">Formula 1</span>
            <span class="small muted">14 entities</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
