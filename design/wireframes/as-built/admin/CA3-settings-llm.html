<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>CA3 · Settings: LLM Configuration</title>
  <meta name="wf-status" content="as-built">
  <meta name="wf-version" content="v0.29.0">
  <meta name="wf-role" content="admin">
  <meta name="wf-spec" content="specs/system/ui.md#49-llm-configuration-settings specs/system/ui.md#13-rail-and-drawer">
  <link rel="stylesheet" href="../../_kit/hub.css">
  <script src="../../_kit/icons.js"></script>
  <script src="../../_kit/shell.js" defer></script>
  <style>
    .wf-lbl { display: flex; flex-direction: column; gap: 4px; }
    .wf-hint { font-size: 10px; line-height: 16px; color: var(--qti-fg-muted); }
    select.field, input.field { height: 38px; }
  </style>
</head>
<!--
  Workflow: Settings -> LLM Configuration. Provider options: OpenAI, Anthropic, LenAI (Halo gateway). With LenAI the
  Model field is labelled "Deployment name" and Base URL appears (OpenAI / Anthropic: "Model", no Base URL).
  Reasoning effort lists the typed model's levels from GET /llm/effort-levels (api 32a, 250 ms after the last keystroke).
  Test connection -> POST /llm/test-connection (api 32) passed and toasted the server message, so Save connection is enabled;
  Save connection -> PUT /llm/settings (api 30, which tests first). Editing any field except Reasoning effort invalidates the test.
-->
<body data-area="Settings" data-settings="LLM Configuration" data-role="admin" data-mode="org" data-initials="AA" data-drawer="collapsed">
  <main style="padding:40px 24px;gap:0;align-items:center">
    <div class="col g12" style="width:100%;max-width:480px">
      <div style="margin-bottom:8px">
        <h2 class="h3" style="font-size:15px">LLM Configuration</h2>
        <div class="small muted" style="margin-top:4px">Configure the language-model provider and verify the credentials.</div>
      </div>
      <label class="wf-lbl"><span class="field-label">Provider</span>
        <select class="field"><option>OpenAI</option><option>Anthropic</option><option selected>LenAI (Halo gateway)</option></select></label>
      <label class="wf-lbl"><span class="field-label">Deployment name</span>
        <input class="field" placeholder="my-deployment" value="mmc-tech-gpt-5-mini-272k-2025-08-07"></label>
      <div class="wf-lbl"><label class="field-label">Reasoning effort</label>
        <select class="field"><option>Minimal</option><option>Low</option><option selected>Medium</option><option>High</option></select>
        <span class="wf-hint">Used for answers. Test connection always uses the lowest level.</span></div>
      <label class="wf-lbl"><span class="field-label">Base URL</span>
        <input class="field" placeholder="https://lenai.example.com" value="https://lenai.contoso.test">
        <span class="wf-hint">Gateway root; requests use &lt;base URL&gt;/openai/v1/deployments/&lt;deployment&gt;.</span></label>
      <label class="wf-lbl"><span class="field-label">API key</span>
        <input class="field" type="password" placeholder="sk-…" value="lenai-key-0123456789"></label>
      <span class="btn btn-secondary" style="margin-top:4px">Test connection</span>
      <span class="btn btn-primary" title="Test the connection successfully before saving">Save connection</span>
    </div>
  </main>

  <!-- Toast: the test result (ui.md 3.3), the server message -->
  <div class="wf-overlay">
    <div class="wf-toast" style="width:360px;padding:12px 14px;align-items:flex-start">
      <i data-lucide="circle-check" data-size="16" style="color:var(--qti-on-success-soft);margin-top:2px"></i>
      <span class="grow" style="font-size:13px;line-height:20px;overflow-wrap:anywhere">Connection successful — lenai/mmc-tech-gpt-5-mini-272k-2025-08-07 replied "OK" in 812ms</span>
      <span style="color:var(--qti-fg-muted);display:flex;margin-top:3px" title="Dismiss notification"><i data-lucide="x" data-size="14"></i></span>
    </div>
  </div>
</body>
</html>
