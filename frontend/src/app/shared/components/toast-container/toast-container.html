<div class="pointer-events-none fixed right-4 bottom-4 z-50 flex w-[360px] flex-col gap-2">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-2.5 rounded-xl border border-white/10 bg-[#2a2a2a] px-3.5 py-3 shadow-xl"
    >
      @switch (toast.kind) {
        @case ('success') {
          <lucide-angular [img]="CircleCheck" [size]="16" class="mt-px shrink-0 text-emerald-400" />
        }
        @case ('error') {
          <lucide-angular [img]="CircleAlert" [size]="16" class="mt-px shrink-0 text-red-400" />
        }
        @case ('info') {
          <lucide-angular [img]="Info" [size]="16" class="mt-px shrink-0 text-sky-400" />
        }
      }
      <p class="min-w-0 flex-1 text-[13px] leading-5 text-zinc-200">{{ toast.message }}</p>
      <button
        (click)="toastService.dismiss(toast.id)"
        class="shrink-0 rounded p-0.5 text-zinc-500 hover:bg-white/10 hover:text-zinc-300"
      >
        <lucide-angular [img]="X" [size]="14" />
      </button>
    </div>
  }
</div>
