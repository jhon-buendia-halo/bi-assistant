@if (visible()) {
  <div
    class="flex h-7 shrink-0 items-center justify-center border-b border-border px-3 text-[12px] font-medium"
    [class.bg-warning-soft]="status() === 'restarting'"
    [class.text-on-warning-soft]="status() === 'restarting'"
    [class.bg-danger-soft]="status() === 'down'"
    [class.text-on-danger-soft]="status() === 'down'"
  >
    @if (status() === 'restarting') {
      <span>Backend restarting…</span>
    } @else {
      <span>Backend unavailable — restart the app</span>
    }
  </div>
}
