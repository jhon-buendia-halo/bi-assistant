@if (visible()) {
  <div
    class="flex h-7 shrink-0 items-center justify-center border-b border-white/5 px-3 text-[12px] font-medium"
    [class.bg-amber-500/15]="status() === 'restarting'"
    [class.text-amber-300]="status() === 'restarting'"
    [class.bg-red-500/15]="status() === 'down'"
    [class.text-red-300]="status() === 'down'"
  >
    @if (status() === 'restarting') {
      <span>Backend restarting…</span>
    } @else {
      <span>Backend unavailable — restart the app</span>
    }
  </div>
}
