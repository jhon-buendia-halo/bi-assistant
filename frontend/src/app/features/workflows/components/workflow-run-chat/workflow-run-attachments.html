<div
  role="group"
  data-testid="workflow-input-images"
  aria-labelledby="workflow-input-images-label"
  [attr.aria-describedby]="error() ? 'workflow-input-error-images' : null"
  class="flex flex-col gap-1"
>
  @if (showLabel()) {
    <!-- In the input form: a labelled section (ui.md 4.4b) -->
    <div class="composer-head">
      <span id="workflow-input-images-label" class="composer-label">{{
        label()
      }}</span>
      <span aria-hidden="true" class="composer-tag composer-tag-optional"
        >Optional</span
      >
    </div>
  } @else {
    <span id="workflow-input-images-label" class="sr-only">{{ label() }}</span>
  }
  <div class="flex flex-wrap items-center gap-2">
    @if (showLabel()) {
      <!-- A visible drop zone: where to click, paste or drop -->
      <button
        type="button"
        data-testid="workflow-input-images-attach"
        aria-label="Attach images"
        [attr.aria-describedby]="help() ? 'workflow-input-images-help' : null"
        [disabled]="images().length >= max()"
        (click)="openPicker()"
        class="images-drop"
      >
        <lucide-angular [img]="ImagePlus" [size]="16" class="shrink-0" />
        <span
          ><span class="font-medium text-fg">Attach images</span>, or paste or
          drop them here</span
        >
      </button>
    } @else {
      <button
        type="button"
        data-testid="workflow-input-images-attach"
        aria-label="Attach images"
        title="Attach images"
        [disabled]="images().length >= max()"
        (click)="openPicker()"
        class="btn-icon"
      >
        <lucide-angular [img]="Paperclip" [size]="16" />
      </button>
    }
    <input
      #file
      type="file"
      multiple
      hidden
      tabindex="-1"
      aria-hidden="true"
      data-testid="workflow-input-images-file"
      [attr.accept]="accept"
      (change)="onFiles($event)"
    />
    @for (src of images(); track $index) {
      <span class="thumb">
        <img
          [src]="src"
          [alt]="'Reference image ' + ($index + 1)"
          [attr.data-testid]="'workflow-input-images-thumb-' + $index"
        />
        <button
          type="button"
          class="thumb-remove"
          [attr.data-testid]="'workflow-input-images-remove-' + $index"
          [attr.aria-label]="'Remove reference image ' + ($index + 1)"
          (click)="removed.emit($index)"
        >
          <lucide-angular [img]="X" [size]="12" />
        </button>
      </span>
    }
  </div>
  @if (help()) {
    <p id="workflow-input-images-help" class="m-0 text-[12px] text-fg-muted">
      {{ help() }}
    </p>
  }
  @if (error(); as message) {
    <p
      id="workflow-input-error-images"
      data-testid="workflow-input-error-images"
      class="m-0 text-[12px] text-on-danger-soft"
    >
      {{ message }}
    </p>
  }
</div>
