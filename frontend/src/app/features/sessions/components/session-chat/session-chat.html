<div class="relative flex h-full min-h-0 flex-col">
  <!-- Chat-history navigation: a tick per user message, the list on hover or focus -->
  <app-chat-history-nav
    class="absolute top-4 right-1.5 z-20"
    [container]="scrollerElement()"
    [items]="historyItems()"
    label="Chat history"
    testIdPrefix="session-chat-history"
  />

  <!-- Messages: a past chat is read-only (past-chats R66) -->
  <div
    #scroller
    class="min-h-0 flex-1 overflow-y-auto px-6 pt-5 pb-4"
    [style.padding-right.px]="historyItems().length >= 2 ? 56 : null"
  >
    <div class="flex w-full flex-col gap-6">
      @for (
        message of messages();
        track message.at + message.role;
        let i = $index
      ) {
        @if (message.role === "user") {
          <div
            class="group flex items-end justify-end gap-2"
            [attr.data-history-id]="'' + i"
          >
            <button
              (click)="copyMessage(message.content)"
              title="Copy message"
              class="mb-1 rounded p-1 text-fg-muted opacity-0 group-hover:opacity-100 hover:bg-surface-muted hover:text-fg"
            >
              <lucide-angular [img]="Copy" [size]="14" />
            </button>
            <div
              class="flex max-w-[800px] items-start gap-3 rounded-xl rounded-tr-[2px] bg-surface-selected p-3"
            >
              <span
                class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-primary text-[14px] leading-5 font-semibold text-on-primary"
                aria-hidden="true"
                >D</span
              >
              <p
                class="min-w-0 text-right text-[14px] leading-[22px] whitespace-pre-wrap text-fg"
              >
                {{ message.content }}
              </p>
            </div>
          </div>
        } @else {
          <app-answer-view
            [message]="message"
            [queryInspector]="hasQueries(message)"
            [question]="questionBefore(i)"
            (inspectQuery)="inspectQuery(i, $event)"
            (viewVisual)="viewVisual.emit($event)"
            (openScorecard)="openScorecard($event)"
          />
        }
      }
    </div>
  </div>
  @if (openQuery(); as open) {
    <!-- The query inspector sheet: at the right of the chat, never wider than 720 px. -->
    <div
      data-testid="query-inspector-sheet"
      class="absolute inset-y-0 right-0 z-30 w-full max-w-[720px] border-l border-border shadow-lg"
    >
      <!-- Deferred: the inspector loads when a query is first opened, not with the page. -->
      @defer (on immediate) {
        <app-query-inspector
          [message]="open.answer"
          [index]="open.query"
          (close)="closeQuery()"
          (navigate)="inspectQuery(open.message, $event)"
        />
      }
    </div>
  }
</div>
