<div class="flex flex-col gap-3">
  <div class="mb-2">
    <h2 class="text-[15px] font-semibold text-fg-strong">LLM Configuration</h2>
    <p class="mt-1 text-[12px] text-fg-muted">
      Configure the language-model provider and verify the credentials.
    </p>
  </div>

  <label class="flex flex-col gap-1">
    <span class="field-label">Provider</span>
    <select
      [value]="provider()"
      (change)="provider.set($any($event.target).value); onFieldChange()"
      class="field"
    >
      <option value="openai" class="bg-surface">OpenAI</option>
      <option value="anthropic" class="bg-surface">Anthropic</option>
      <option value="lenai" class="bg-surface">LenAI (Halo gateway)</option>
    </select>
  </label>

  <label class="flex flex-col gap-1">
    <span class="field-label">
      {{ provider() === 'lenai' ? 'Deployment name' : 'Model' }}
    </span>
    <input
      type="text"
      [placeholder]="provider() === 'lenai' ? 'my-deployment' : provider() === 'anthropic' ? 'claude-sonnet-5-5' : 'gpt-4o-mini'"
      [value]="model()"
      (input)="model.set($any($event.target).value); onFieldChange()"
      class="field"
    />
  </label>

  @if (effortLevels().length) {
    <label class="flex flex-col gap-1">
      <span class="field-label">Reasoning effort</span>
      <select
        [value]="reasoningEffort()"
        (change)="onEffortChange($any($event.target).value)"
        class="field"
      >
        @for (level of effortLevels(); track level) {
          <option
            [value]="level"
            [selected]="level === reasoningEffort()"
            class="bg-surface"
          >
            {{ effortLabels[level] }}
          </option>
        }
      </select>
      <span class="text-[10px] leading-4 text-fg-muted">
        Used for answers. Test connection always uses the lowest level.
      </span>
    </label>
  }

  @if (provider() === 'lenai') {
    <label class="flex flex-col gap-1">
      <span class="field-label">Base URL</span>
      <input
        type="text"
        placeholder="https://lenai.example.com"
        [value]="baseUrl()"
        (input)="baseUrl.set($any($event.target).value); onFieldChange()"
        class="field"
      />
      <span class="text-[10px] leading-4 text-fg-muted">
        Gateway root; requests use
        &lt;base URL&gt;/openai/v1/deployments/&lt;deployment&gt;.
      </span>
    </label>
  }

  <label class="flex flex-col gap-1">
    <span class="field-label">API key</span>
    <input
      type="password"
      [placeholder]="apiKeyPlaceholder()"
      [value]="apiKey()"
      (input)="apiKey.set($any($event.target).value); onFieldChange()"
      class="field"
    />
  </label>

  @if (keyUnreadable()) {
    <p
      data-testid="llm-key-unreadable-notice"
      class="flex items-start gap-2 rounded-md border border-on-warning-soft/30 bg-warning-soft px-3 py-2.5 text-[12px] text-on-warning-soft"
    >
      <lucide-angular
        [img]="TriangleAlert"
        [size]="14"
        class="mt-0.5 shrink-0"
      />
      <span>
        Your saved API key can't be read because the app secret changed. Enter
        the key again, test and save.
      </span>
    </p>
  }

  <button
    (click)="testConnection()"
    [disabled]="!canTest"
    class="btn btn-secondary mt-1"
  >
    @if (testing()) {
      <lucide-angular [img]="Loader2" [size]="14" class="animate-spin" />
      <span>Testing…</span>
    } @else {
      <span>Test connection</span>
    }
  </button>

  <button
    (click)="saveConnection()"
    [disabled]="!testedOk() || saving()"
    title="Test the connection successfully before saving"
    class="btn btn-primary"
  >
    @if (saving()) {
      <lucide-angular [img]="Loader2" [size]="14" class="animate-spin" />
      <span>Saving…</span>
    } @else {
      <span>Save connection</span>
    }
  </button>
</div>
