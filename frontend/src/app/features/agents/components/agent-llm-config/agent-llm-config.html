@if (rows(); as rows) {
  <div class="flex max-w-[520px] flex-col gap-2.5 text-[13px]">
    @for (row of rows; track row.label; let last = $last) {
      <div
        [attr.data-testid]="'llm-' + row.label"
        class="flex justify-between gap-4"
        [class.border-b]="!last"
        [class.border-border]="!last"
        [class.pb-2.5]="!last"
      >
        <span class="text-fg-muted">{{ row.label }}</span>
        <span class="text-right font-mono text-fg">{{ row.value }}</span>
      </div>
    }
  </div>
} @else {
  <p class="text-[13px] text-fg-muted">
    No model resolved — save an LLM configuration in Settings first.
  </p>
}
