@let a = agent();
<div
  [attr.data-testid]="'agent-card-' + a.key"
  class="relative flex h-full rounded-xl border border-white/10 bg-[#232323] hover:border-white/15 has-[.agent-open:focus-visible]:outline has-[.agent-open:focus-visible]:outline-1 has-[.agent-open:focus-visible]:outline-white/25"
>
  <button
    type="button"
    [attr.data-testid]="'agent-' + a.key"
    (click)="open.emit()"
    class="agent-open flex min-w-0 flex-1 flex-col gap-2.5 rounded-xl p-4 text-left outline-none"
  >
    <!-- The tile row also holds the pin toggle (absolutely placed), so the
         name gets the card's full width even three cards to a row. -->
    <span
      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-white/5 text-zinc-400"
    >
      <lucide-angular [img]="Sparkles" [size]="15" />
    </span>
    <span class="truncate text-[14px] font-medium text-zinc-200">{{
      a.name
    }}</span>
    @if (a.description) {
      <span class="line-clamp-2 text-[12px] leading-relaxed text-zinc-400">{{
        a.description
      }}</span>
    }
    <span class="mt-auto flex flex-wrap items-center gap-2 pt-1">
      <span class="text-[11px] text-zinc-400">Owner: {{ owner() }}</span>
      @if (isUser()) {
        <span
          [attr.data-testid]="'agent-status-' + a.key"
          class="rounded-full px-2 py-0.5 text-[10px] font-medium"
          [class.bg-emerald-500/10]="a.status === 'live'"
          [class.text-emerald-400]="a.status === 'live'"
          [class.bg-white/5]="a.status !== 'live'"
          [class.text-zinc-400]="a.status !== 'live'"
          >{{ a.status === "live" ? "Live" : "Draft" }}</span
        >
        @if (a.hasUnpublishedChanges) {
          <span
            class="rounded-full bg-amber-500/10 px-2 py-0.5 text-[10px] font-medium text-amber-300"
            >Unpublished changes</span
          >
        }
      }
    </span>
    @if (missing()) {
      <span class="flex items-center gap-1.5 text-[11px] text-amber-400">
        <lucide-angular [img]="TriangleAlert" [size]="12" class="shrink-0" />
        <span>Missing dataset: {{ missing() }}</span>
      </span>
    }
  </button>

  <button
    type="button"
    (click)="togglePin.emit()"
    [attr.aria-pressed]="!!a.pinned"
    [attr.aria-label]="(a.pinned ? 'Unpin ' : 'Pin ') + a.name"
    class="group/pin absolute top-[22px] right-3 flex items-center gap-1 rounded-md px-1.5 py-0.5 text-[11px]"
    [class.bg-white/10]="a.pinned"
    [class.text-zinc-200]="a.pinned"
    [class.text-zinc-400]="!a.pinned"
    [class.hover:text-zinc-200]="!a.pinned"
  >
    @if (a.pinned) {
      <lucide-angular
        [img]="Pin"
        [size]="12"
        class="group-hover/pin:hidden group-focus-visible/pin:hidden"
      />
      <lucide-angular
        [img]="PinOff"
        [size]="12"
        class="hidden group-hover/pin:inline-flex group-focus-visible/pin:inline-flex"
      />
      <span>Pinned</span>
    } @else {
      <lucide-angular [img]="Pin" [size]="12" />
      <span>Pin</span>
    }
  </button>
</div>
