<div class="flex min-h-0 flex-1 flex-col gap-3">
  <div class="flex items-center justify-between gap-4">
    <p class="text-[12px] text-fg-muted">
      Edit the model's YAML directly. Saving creates a new version; the
      current one is untouched if validation fails.
    </p>
    @if (!readOnly()) {
      <button
        type="button"
        data-testid="save-yaml"
        (click)="save()"
        [disabled]="!canSave()"
        title="No changes to save"
        class="btn btn-primary shrink-0"
      >
        @if (saving()) {
          <lucide-angular [img]="Loader2" [size]="14" class="animate-spin" />
          <span>Saving…</span>
        } @else {
          <lucide-angular [img]="Save" [size]="14" />
          <span>Save as new version</span>
        }
      </button>
    }
  </div>

  @if (errors().length > 0) {
    <div
      data-testid="yaml-errors"
      class="flex flex-col gap-1 rounded-md bg-danger-soft p-2.5 text-on-danger-soft"
    >
      @for (issue of errors(); track $index) {
        <button
          type="button"
          (click)="jumpToError(issue)"
          [disabled]="issue.line === undefined"
          class="flex items-start gap-2 rounded px-1.5 py-1 text-left text-[12px] text-on-danger-soft enabled:hover:underline disabled:cursor-default"
        >
          <lucide-angular
            [img]="AlertTriangle"
            [size]="13"
            class="mt-0.5 shrink-0"
          />
          <span>
            <span class="font-mono font-medium">{{ issue.path }}</span>
            @if (issue.line !== undefined) {
              <span>
                ·
                @if (issue.col !== undefined) {
                  {{ issue.line }}:{{ issue.col }}
                } @else {
                  line {{ issue.line }}
                }
              </span>
            }
            <span class="block">{{ issue.message }}</span>
          </span>
        </button>
      }
    </div>
  }

  <div
    class="flex min-h-0 flex-1 overflow-hidden rounded-lg border border-border bg-surface-muted"
  >
    <div
      #gutterEl
      class="select-none overflow-hidden border-r border-border px-2 py-2 text-right font-mono text-[11px] leading-5 text-fg-muted"
    >
      @for (n of lineNumbers(); track n) {
        <div
          [attr.data-testid]="'yaml-line-' + n"
          [attr.data-highlighted]="highlightedLine() === n"
          [class.text-on-warning-soft]="highlightedLine() === n"
          [class.font-semibold]="highlightedLine() === n"
        >
          {{ n }}
        </div>
      }
    </div>
    <textarea
      #textareaEl
      data-testid="yaml-textarea"
      aria-label="Model YAML"
      [value]="text()"
      [readOnly]="readOnly()"
      (input)="onInput($any($event.target).value)"
      (scroll)="onScroll($any($event.target))"
      spellcheck="false"
      wrap="off"
      class="min-h-0 flex-1 resize-none overflow-auto bg-transparent px-3 py-2 font-mono text-[11px] leading-5 whitespace-pre text-fg outline-none"
    ></textarea>
  </div>
</div>
