<button
  type="button"
  class="btn btn-secondary"
  data-testid="readiness-history"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
>
  <lucide-angular [img]="History" [size]="14" />
  Past assessments
</button>
@if (open()) {
  <button
    type="button"
    aria-label="Close past assessments"
    class="fixed inset-0 z-20 cursor-default"
    (click)="close()"
  ></button>
  <div
    class="absolute top-full right-0 z-30 mt-1 w-72 menu"
    role="menu"
    data-testid="readiness-history-menu"
  >
    @if (loading()) {
      <p class="px-2.5 py-2 text-[12px] text-fg-muted">Loading…</p>
    } @else if (error() && reports().length === 0) {
      <p class="px-2.5 py-2 text-[12px] text-danger" role="alert">
        {{ error() }}
      </p>
    } @else if (isEmpty()) {
      <p class="px-2.5 py-2 text-[12px] text-fg-muted">
        No earlier assessments.
      </p>
    } @else {
      @if (error()) {
        <p class="px-2.5 py-1 text-[12px] text-danger" role="alert">
          {{ error() }}
        </p>
      }
      @for (r of reports(); track r.id) {
        <button
          type="button"
          role="menuitem"
          class="menu-item"
          [attr.data-testid]="'readiness-history-item-' + r.id"
          [attr.aria-current]="r.id === currentReportId() ? 'true' : null"
          [class.bg-surface-muted]="r.id === currentReportId()"
          [disabled]="choosing() !== null"
          (click)="choose(r)"
        >
          <span class="min-w-0 flex-1 truncate">
            {{ r.generatedAt | date: "medium" }}
            <span class="text-fg-muted">· {{ r.entityCount }} entities</span>
          </span>
          <span class="shrink-0 font-medium text-fg-strong"
            >{{ r.overallScore }}/100</span
          >
          <span
            class="shrink-0 rounded-full px-2 py-0.5 text-[11px]"
            [class]="bandClass(r.maturity)"
            >{{ r.maturity }}</span
          >
        </button>
      }
    }
  </div>
}
