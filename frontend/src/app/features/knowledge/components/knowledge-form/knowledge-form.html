<div
  class="flex flex-col gap-3 rounded-xl border border-border bg-surface-muted p-4"
>
  <div class="flex items-center justify-between">
    <p class="text-[13px] font-medium text-fg">
      {{ snippet() ? "Edit snippet" : "New snippet" }}
    </p>
    <button
      type="button"
      title="Close"
      (click)="cancel()"
      class="btn-icon"
    >
      <lucide-angular [img]="X" [size]="14" />
    </button>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <label class="flex flex-col gap-1">
      <span class="field-label">Kind</span>
      <select
        [value]="kind()"
        [title]="kindDescription(kind())"
        (change)="kind.set($any($event.target).value)"
        class="field"
      >
        @for (option of kinds; track option.value) {
          <option
            [value]="option.value"
            [title]="option.description"
            class="bg-surface"
          >
            {{ option.label }}
          </option>
        }
      </select>
      <span class="text-[11px] leading-snug text-fg-muted">{{
        kindDescription(kind())
      }}</span>
    </label>
    <label class="flex flex-col gap-1">
      <span class="field-label">Scope</span>
      <select
        [value]="datasetScope()"
        (change)="datasetScope.set($any($event.target).value)"
        class="field"
      >
        <option value="" class="bg-surface">Global</option>
        @for (dataset of datasets(); track dataset.name) {
          <option [value]="dataset.name" class="bg-surface">
            {{ dataset.name }}
          </option>
        }
      </select>
    </label>
  </div>

  <label class="flex flex-col gap-1">
    <span class="field-label">Title</span>
    <input
      type="text"
      placeholder="Always exclude test accounts"
      [value]="title()"
      (input)="title.set($any($event.target).value)"
      class="field"
    />
  </label>

  <label class="flex flex-col gap-1">
    <span class="field-label">Body</span>
    <textarea
      rows="4"
      placeholder="Plain-text instruction, definition or default filter the assistant should apply."
      [value]="body()"
      (input)="body.set($any($event.target).value)"
      class="field resize-y"
    ></textarea>
  </label>

  @if (kind() === "term") {
    <label class="flex flex-col gap-1">
      <span class="field-label"
        >Synonyms (comma separated)</span
      >
      <input
        type="text"
        placeholder="churn, attrition, cancellation"
        [value]="synonyms()"
        (input)="synonyms.set($any($event.target).value)"
        class="field"
      />
    </label>
  }

  <label class="flex flex-col gap-1">
    <span class="field-label"
      >Entities (optional, comma separated)</span
    >
    <input
      type="text"
      placeholder="claims, members"
      [value]="entities()"
      (input)="entities.set($any($event.target).value)"
      class="field"
    />
  </label>

  <div class="mt-1 flex items-center gap-2 text-[13px]">
    <button
      type="button"
      (click)="cancel()"
      class="btn btn-outline flex-1"
    >
      Cancel
    </button>
    <button
      type="button"
      data-testid="save-knowledge-snippet"
      (click)="save()"
      [disabled]="!canSave()"
      title="Title and body are required"
      class="btn btn-primary flex-1"
    >
      @if (saving()) {
        <lucide-angular [img]="Loader2" [size]="14" class="animate-spin" />
        <span>Saving…</span>
      } @else {
        <span>{{ snippet() ? "Save changes" : "Create snippet" }}</span>
      }
    </button>
  </div>
</div>
