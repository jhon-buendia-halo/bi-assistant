@if (open() !== null || state.loading() || state.error()) {
  @if (fullScreen()) {
    <!-- Clicking outside the full-screen visual closes the full screen -->
    <button
      type="button"
      aria-label="Exit full screen"
      class="fixed inset-0 z-40 cursor-default bg-black/40"
      (click)="fullScreen.set(false)"
    ></button>
  }
  <!-- Inline under the answer, or (sheet) a full-height panel on the
       window's right edge that opens from a run's artifact card (visuals R42) -->
  <section
    #panel
    tabindex="-1"
    class="card overflow-hidden outline-none"
    [class.mt-4]="!fullScreen() && !sheet()"
    [class.fixed]="fullScreen() || sheet()"
    [class.inset-4]="fullScreen()"
    [class.z-50]="fullScreen()"
    [class.flex]="fullScreen() || sheet()"
    [class.flex-col]="fullScreen() || sheet()"
    [class.run-visual-sheet]="sheet() && !fullScreen()"
    [attr.role]="fullScreen() || sheet() ? 'dialog' : null"
    [attr.aria-modal]="fullScreen() ? 'true' : null"
    [attr.aria-label]="sheet() ? (title() ?? 'Visual') : 'Visual'"
    data-testid="run-visual"
    [attr.data-full-screen]="fullScreen() ? 'true' : null"
    [attr.data-sheet]="sheet() ? 'true' : null"
    (keydown.escape)="onEscape()"
  >
    <div
      class="flex items-center justify-between gap-2"
      [class]="sheet() ? 'border-b border-border px-4 py-3' : 'px-3 pt-2'"
    >
      @if (sheet()) {
        <div class="flex min-w-0 items-center gap-2">
          <span class="chip chip-info shrink-0" data-testid="run-visual-kind">{{
            kind().label
          }}</span>
          <h2
            class="m-0 truncate text-[15px] leading-6 font-semibold text-fg-strong"
            data-testid="run-visual-title"
          >
            {{ title() ?? "Loading…" }}
          </h2>
        </div>
      } @else {
        <h2
          class="text-[12px] font-medium tracking-wider text-fg-muted uppercase"
        >
          Visual
        </h2>
      }
      <div class="flex shrink-0 items-center gap-1">
        <button
          type="button"
          data-testid="run-visual-full-screen"
          [attr.aria-label]="fullScreen() ? 'Exit full screen' : 'Full screen'"
          [attr.title]="fullScreen() ? 'Exit full screen' : 'Full screen'"
          [attr.aria-pressed]="fullScreen()"
          (click)="fullScreen.set(!fullScreen())"
          class="rounded-lg p-1 text-icon hover:bg-surface-muted"
        >
          <lucide-angular
            [img]="fullScreen() ? Minimize2 : Maximize2"
            [size]="14"
          />
        </button>
        <button
          type="button"
          aria-label="Close visual"
          title="Close visual"
          data-testid="run-visual-close"
          (click)="fullScreen.set(false); state.close()"
          class="rounded-lg p-1 text-icon hover:bg-surface-muted"
        >
          <lucide-angular [img]="X" [size]="14" />
        </button>
      </div>
    </div>
    <div
      [class.h-[520px]]="!fullScreen() && !sheet()"
      [class.min-h-0]="fullScreen() || sheet()"
      [class.flex-1]="fullScreen() || sheet()"
    >
      <app-interactive-visual-panel
        class="h-full"
        [runId]="run().id"
        [visualization]="open()?.visualization ?? null"
        [readOnly]="codeBuilt()"
        [loading]="state.loading()"
        [error]="state.error()"
        [downloading]="state.downloading() !== null"
        [chrome]="!sheet()"
        (downloadVisual)="state.download($event)"
        (selectVersion)="state.selectVersion($event)"
        (revertVersion)="state.revert($event, apply)"
        (visualRefreshed)="onRefreshed($event)"
      />
    </div>
  </section>
}
