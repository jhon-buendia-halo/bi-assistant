@if (user(); as user) {
  <button
    #trigger
    type="button"
    (click)="toggle()"
    [title]="user.displayName"
    aria-label="Account menu"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="open() ? 'account-menu-items' : null"
    class="mx-2 flex size-8 items-center justify-center rounded-full bg-primary text-[14px] font-semibold text-on-primary"
  >
    {{ user.initials }}
  </button>

  @if (open()) {
    <!-- Backdrop closes the menu on an outside click -->
    <div class="fixed inset-0 z-40" (click)="close()"></div>
    <div
      data-testid="account-menu"
      class="menu fixed z-50 w-60"
      [style.left.px]="position().left"
      [style.bottom.px]="position().bottom"
    >
      <div class="px-2.5 pt-1.5 pb-2">
        <p class="truncate text-[13px] font-semibold text-fg-strong">
          {{ user.displayName }}
        </p>
        @if (user.email) {
          <p class="truncate text-[12px] text-fg-muted" [title]="user.email">
            {{ user.email }}
          </p>
        }
      </div>
      <div class="mb-1 h-px bg-border"></div>
      <div id="account-menu-items" role="menu" aria-label="Account">
        <button
          #signOutItem
          type="button"
          role="menuitem"
          (click)="auth.signOut()"
          [disabled]="auth.signingOut()"
          class="menu-item disabled:opacity-55"
        >
          <lucide-angular [img]="LogOut" [size]="14" />
          <span>{{ auth.signingOut() ? "Signing out…" : "Sign out" }}</span>
        </button>
      </div>
    </div>
  }
}
