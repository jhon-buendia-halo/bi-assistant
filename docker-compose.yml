name: questions-to-insights-world-cup

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: world_cup
      POSTGRES_USER: world_cup
      POSTGRES_PASSWORD: world_cup_dev
    ports:
      - "${WORLD_CUP_DB_PORT:-55432}:5432"
    volumes:
      - world_cup_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U world_cup -d world_cup"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Opt-in developer observability (roadmap 0.3.3). Never started by a plain
  # `docker compose up` or the E2E global setup; start with
  # `docker compose --profile observability up -d --wait`.
  phoenix:
    profiles: [observability]
    image: arizephoenix/phoenix:version-20.19.0
    ports:
      # UI and OTLP HTTP traces (/v1/traces)
      - "${PHOENIX_PORT:-6006}:6006"

  otel-lgtm:
    profiles: [observability]
    image: grafana/otel-lgtm:0.35.0
    ports:
      # Grafana UI (3000 is the backend)
      - "${GRAFANA_PORT:-3001}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  world_cup_postgres_data:
